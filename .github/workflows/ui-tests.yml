name: UI tests

# 시뮬레이터에서 앱을 실제로 눌러 보며 주요 흐름을 확인하고 스크린샷을 아티팩트로 올린다.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - "ReverseTicTacToe/**"
      - "ReverseTicTacToeUITests/**"
      - "ReverseTicTacToe.xcodeproj/**"
      - ".github/workflows/ui-tests.yml"

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          phones.sort(key=lambda d: ("Pro" in d["name"] or "Plus" in d["name"] or "Max" in d["name"], d["name"]))
          print(phones[0]["udid"])
          print(phones[0]["name"], file=sys.stderr)
          ')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ReverseTicTacToe.xcodeproj \
            -scheme ReverseTicTacToe \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            | grep -E "Test Case|error:|failed|passed|\*\*"

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path screenshots || true
          ls screenshots | head -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
